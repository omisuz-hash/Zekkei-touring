# XcodeGen 定義。Mac 上で `xcodegen generate` を実行すると ZekkeiTouring.xcodeproj が生成される
name: ZekkeiTouring
options:
  bundleIdPrefix: com.zekkeido
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.20.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "8.0.0"
targets:
  ZekkeiTouring:
    type: application
    platform: iOS
    sources:
      - path: ZekkeiTouring
    dependencies:
      - package: Supabase
        product: Supabase
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
    entitlements:
      path: ZekkeiTouring/Resources/ZekkeiTouring.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    info:
      path: ZekkeiTouring/Resources/Info.plist
      properties:
        CFBundleDisplayName: 絶景道
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: 走行した道を記録し、絶景道として切り出すために位置情報を使用します。
        NSLocationAlwaysAndWhenInUseUsageDescription: 走行中に画面を閉じても記録を続けるため、常に位置情報の利用を許可してください。記録は端末に保存され、あなたが選んだ区間のみが公開されます。
        NSPhotoLibraryUsageDescription: 絶景道の写真を投稿するために写真ライブラリへアクセスします。
        NSCameraUsageDescription: 絶景道の写真を撮影して投稿するためにカメラを使用します。
        UIBackgroundModes: [location]
        # Google ログインのコールバック用 URL スキーム。GoogleService の REVERSED_CLIENT_ID に置き換える
        CFBundleURLTypes:
          - CFBundleURLSchemes: [com.googleusercontent.apps.REPLACE_WITH_REVERSED_CLIENT_ID]
        # 接続先。値は Supabase ダッシュボードから取得し、ビルド設定で差し替える
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        GoogleClientID: $(GOOGLE_CLIENT_ID)
    settings:
      base:
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        SUPABASE_URL: https://REPLACE.supabase.co
        SUPABASE_ANON_KEY: REPLACE
        GOOGLE_CLIENT_ID: REPLACE.apps.googleusercontent.com
